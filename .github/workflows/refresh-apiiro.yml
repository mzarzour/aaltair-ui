name: Refresh Aaltair data
on:
  workflow_dispatch:
  schedule:
    # Off-peak polling also handles Refresh Now requests.
    - cron: '7,22,37,52 * * * *'
    # Dedicated morning attempts: 7:03/7:33 Central in either DST season.
    # The server's America/Chicago date guard skips early and completed days.
    - cron: '3,33 12,13,14 * * *'
permissions:
  contents: read
concurrency:
  group: aaltair-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Process queued or morning refresh
        env:
          APIIRO_API_TOKEN: ${{ secrets.APIIRO_API_TOKEN }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
          REFRESH_RUNNER_TOKEN: ${{ secrets.REFRESH_RUNNER_TOKEN }}
        run: python3 scripts/github-refresh.py
